[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-ml-platform"
version = "0.1.0"
description = "A LangGraph experiment planner and reviewer for tabular machine learning"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0.8,<2",
    "scikit-learn>=1.5,<1.9",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
llm = ["openai>=2.0,<3"]
dev = ["pytest>=8,<10"]

[project.scripts]
ml-experiment = "automl.cli:main"

[tool.setuptools]
packages = ["automl"]
